#cloud-config
# cert-hub host bootstrap — mirrors syscode-cert-hub/scripts/cloud-init.yaml exactly.
# Source of truth: syscode-cert-hub repo. Keep in sync when updating bootstrap steps.
# NOTE (ogc): Tailscale bootstrap below is module-local (not in cert-hub) so each
# E2.1.Micro registers on the tailnet for operator access.

package_update: true

# TEMP: allow serial-console (getty) password login for oci-micro-01 debugging.
# Password comes from instance metadata key temp_diag_password (var.temp_diag_password).
# Remove ssh_pwauth + password runcmd after diagnose.
ssh_pwauth: true

packages:
  - ca-certificates
  - curl
  - gnupg

write_files:
  # Disable systemd-resolved stub listener — it holds port 53, conflicting with
  # the acme-dns container which binds 0.0.0.0:53.
  - path: /etc/systemd/resolved.conf.d/no-stub.conf
    permissions: "0644"
    owner: root:root
    content: |
      [Resolve]
      DNSStubListener=no
      DNS=8.8.8.8 1.1.1.1

  # Docker daemon: point at real resolvers. After disabling the stub listener,
  # Docker's internal 127.0.0.11 DNS can no longer reach upstream — fix it here.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    owner: root:root
    content: |
      {"dns": ["8.8.8.8", "1.1.1.1"]}

runcmd:
  # ── TEMP: set ubuntu serial-console password from metadata (diag) ─────────
  - >-
    PW=$(curl -sf -H "Authorization: Bearer Oracle"
    http://169.254.169.254/opc/v2/instance/metadata/temp_diag_password) &&
    [ -n "$PW" ] && echo "ubuntu:$PW" | chpasswd || true

  # ── Docker: official apt repo ──────────────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >-
    echo
    "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu
    $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update -qq
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now containerd docker

  # ── DNS: apply resolved drop-in and fix resolv.conf symlink ───────────────
  - systemctl restart systemd-resolved
  - ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf

  # ── Docker daemon: restart with new daemon.json ───────────────────────────
  - systemctl restart docker

  # ── Tailscale: join tailnet so the Micro is operator-reachable ────────────
  # Auth key is injected per-instance via OCI metadata (var.tailscale_auth_key)
  # so no secret is baked into user-data or the image. Endpoint per OCI IMDSv2:
  # http://169.254.169.254/opc/v2/instance/metadata/tailscale_auth_key
  - >-
    curl --retry 3 --retry-delay 2 -fsSL
    https://pkgs.ts.tailscale.com/stable/ubuntu/noble.noarch
    -o /usr/share/keyrings/tailscale-archive-keyring.gpg
  - >-
    echo
    "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
    https://pkgs.ts.tailscale.com/stable/ubuntu noble main"
    > /etc/apt/sources.list.d/tailscale.list
  - apt-get update -qq
  - apt-get install -y tailscale
  # ── TEMP: retry loop + logging so a transient failure is not swallowed ────
  - >-
    TS_KEY=$(curl -sf -H "Authorization: Bearer Oracle"
    http://169.254.169.254/opc/v2/instance/metadata/tailscale_auth_key);
    echo "[boot] TS_KEY_len=${#TS_KEY}" >> /var/log/tailscale-boot.log;
    for i in 1 2 3 4 5; do
      if [ -n "$TS_KEY" ] && tailscale up --auth-key="$TS_KEY" --hostname="$(hostname)"; then
        echo "[boot] tailscale up OK on attempt $i" >> /var/log/tailscale-boot.log;
        break;
      fi;
      echo "[boot] tailscale up FAILED attempt $i rc=$?" >> /var/log/tailscale-boot.log;
      sleep 15;
    done;
    tailscale status >> /var/log/tailscale-boot.log 2>&1 || true;
    echo "[boot] hostname=$(hostname) cloudinit=$(cloud-init status 2>&1)" >> /var/log/tailscale-boot.log
