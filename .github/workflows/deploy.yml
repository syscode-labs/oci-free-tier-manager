name: Deploy
run-name: Deploy ${{ inputs.release_id || inputs.reason }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "manual"
      release_id:
        description: "Immutable coordinator release ID. Empty preserves the manual lane."
        required: false
        default: ""
      coordinator_release:
        description: "Require controller-bound artifact and post-change health verification."
        required: false
        default: "false"
      talos_version:
        description: "Approved Talos version for a coordinator release."
        required: false
        default: ""
      kubernetes_version:
        description: "Approved Kubernetes version for a coordinator release."
        required: false
        default: ""
      talos_image_ocid:
        description: "Exact OCI custom-image OCID to deploy. Required; never resolved from latest."
        required: false
        default: ""
      talos_image_ref:
        description: "Immutable OCI installer reference from the accepted build callback."
        required: false
        default: ""
      talos_image_digest:
        description: "Immutable OCI installer manifest digest from the accepted build callback."
        required: false
        default: ""
      targets:
        description: "Space-separated addresses passed as -target (empty = full plan). For one-off additive rollouts."
        required: false
        default: ""
      apply:
        description: "Apply after plan (true) or plan-only for review (false)."
        required: false
        default: "false"
      vpn_probe:
        description: "Create the temporary OCI VPN probe instance (targeted workflow only)."
        required: false
        default: "false"
      cpe_remediator_mode:
        description: >-
          function (default), retire-function (remove Function with both timers
          disabled), or local-remediator (enable only local timer after
          retire-function verification).
        required: false
        default: "function"
      destroy:
        description: "Run targeted destroy. Requires targets and apply=true."
        required: false
        default: "false"
      allow_replace:
        description: "Allow delete/create replacement, but only for explicit targets."
        required: false
        default: "false"
      replace:
        description: "Space-separated -replace addresses to force recreation past ignore_changes."
        required: false
        default: ""
      ssh_public_key:
        description: "Override for var.ssh_public_key (all Ubuntu instances). Empty = use the SSH_PUBLIC_KEY secret."
        required: false
        default: ""
      temp_diag_password:
        description: "TEMP: throwaway serial-console password for oci-micro-01 debugging (remove after diagnose)."
        required: false
        default: ""
      extra_tfvars:
        description: "Extra -var key=value pairs, one per line, for one-off targeted resources."
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Tofu Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate supplied Talos image identity
        id: talos_image
        env:
          COORDINATOR_RELEASE: ${{ github.event.inputs.coordinator_release || 'false' }}
          RELEASE_ID: ${{ github.event.inputs.release_id || '' }}
          TALOS_VERSION: ${{ github.event.inputs.talos_version || '' }}
          TALOS_IMAGE_OCID: ${{ github.event.inputs.talos_image_ocid || '' }}
          TALOS_IMAGE_REF: ${{ github.event.inputs.talos_image_ref || '' }}
          TALOS_IMAGE_DIGEST: ${{ github.event.inputs.talos_image_digest || '' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          coordinator = os.environ["COORDINATOR_RELEASE"]
          release_id = os.environ["RELEASE_ID"]
          version = os.environ["TALOS_VERSION"]
          image_ocid = os.environ["TALOS_IMAGE_OCID"]
          image_ref = os.environ["TALOS_IMAGE_REF"]
          image_digest = os.environ["TALOS_IMAGE_DIGEST"]
          if not re.fullmatch(r"ocid1\.image\.[A-Za-z0-9._-]+", image_ocid):
              sys.exit("ERROR: talos_image_ocid must be an explicit OCI custom-image OCID")
          if coordinator == "true":
              if not release_id or not version:
                  sys.exit("ERROR: coordinator_release requires release_id and talos_version")
              if image_ref != f"ghcr.io/syscode-labs/talos-images/installer:{version}":
                  sys.exit("ERROR: coordinator OCI image ref is not bound to the approved Talos version")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", image_digest):
                  sys.exit("ERROR: coordinator OCI image digest must be immutable")
          elif bool(image_ref) != bool(image_digest):
              sys.exit("ERROR: manual image ref and digest must be supplied together")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ocid={image_ocid}\n")
          PY

      - name: Write OCI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_API_KEY_PEM" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
          OCI_REGION: ${{ secrets.OCI_REGION }}

      - name: Write backend config
        run: printf '%s' "$TF_BACKEND_CONFIG" > tofu/oci/backend-config.tfvars
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}

      - name: Install SOPS
        uses: nhedger/setup-sops@v2

      - name: Decrypt private Terraform values
        run: |
          sops --decrypt --input-type binary --output-type binary \
            tofu/oci/terraform.sops > tofu/oci/terraform.tfvars
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Verify local remediator retirement
        if: github.event.inputs.cpe_remediator_mode == 'local-remediator'
        env:
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          CPE_REMEDIATOR_MODE: ${{ github.event.inputs.cpe_remediator_mode || 'function' }}
        run: |
          if [ "$CPE_REMEDIATOR_MODE" != "local-remediator" ]; then
            exit 0
          fi
          FUNCTIONS=$(oci fn function list --compartment-id "$OCI_COMPARTMENT_OCID" \
            --all --output json)
          SCHEDULES=$(oci resource-scheduler schedule list \
            --compartment-id "$OCI_COMPARTMENT_OCID" --all --output json)
          FUNCTION_QUERY='[.data[] | select(."display-name" == "cpe-auto-recreate"'
          FUNCTION_QUERY+=' and ."lifecycle-state" != "DELETED")] | length == 0'
          SCHEDULE_QUERY='[.data[] | select(."display-name" == "cpe-auto-recreate-schedule"'
          SCHEDULE_QUERY+=' and ."lifecycle-state" != "DELETED")] | length == 0'
          if ! jq -e "$FUNCTION_QUERY" <<< "$FUNCTIONS" >/dev/null || \
            ! jq -e "$SCHEDULE_QUERY" <<< "$SCHEDULES" >/dev/null; then
            echo "ERROR: cpe-auto-recreate Function or scheduler still exists."
            echo "Complete the reviewed retire-function apply first."
            exit 1
          fi

      - name: Check live Always Free usage
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: >-
          python3 scripts/check_free_tier_usage.py
          --tenancy-ocid "$OCI_TENANCY_OCID"
          --output free-tier-current.json

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.0
        with:
          tofu_version: "1.11.5"

      - name: Setup Go for remediator artifact
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build remediator artifact
        run: bash scripts/build-cpe-remediator.sh

      - name: Tofu Init
        working-directory: tofu/oci
        run: tofu init -backend-config=backend-config.tfvars

      - name: Tofu Plan
        working-directory: tofu/oci
        run: |
          TARGET_ARGS=""
          for t in $TARGETS; do TARGET_ARGS="$TARGET_ARGS -target=$t"; done
          [ -n "$TARGET_ARGS" ] && echo "Targeted plan:$TARGET_ARGS"
          DESTROY_ARG=""
          if [ "$DESTROY" = "true" ]; then
            if [ -z "$TARGETS" ]; then
              echo "ERROR: destroy=true requires explicit targets"
              exit 1
            fi
            DESTROY_ARG="-destroy"
            echo "Targeted destroy enabled"
          fi
          REPLACE_ARGS=""
          if [ -n "$REPLACE" ]; then
            if [ "$ALLOW_REPLACE" != "true" ]; then
              echo "ERROR: replace requires allow_replace=true"
              exit 1
            fi
            for r in $REPLACE; do REPLACE_ARGS="$REPLACE_ARGS -replace=$r"; done
            echo "Forced replace:$REPLACE_ARGS"
          fi
          EXTRA_TFVARS_ARGS=()
          if [ -n "$EXTRA_TFVARS" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if [[ "$line" =~ ^[[:space:]]*(enable_cpe_remediator|cpe_remediator_mode)[[:space:]]*= ]]; then
                echo "ERROR: executor mode must be set only through cpe_remediator_mode"
                exit 1
              fi
              if ! [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=[-A-Za-z0-9_./,:=@+%]*$ ]]; then
                echo "ERROR: invalid extra_tfvars assignment: expected safe key=value"
                echo "without whitespace or shell characters"
                exit 1
              fi
              EXTRA_TFVARS_ARGS+=("-var=$line")
            done <<< "$EXTRA_TFVARS"
            echo "Extra tfvars set (values not logged)"
          fi
          tofu plan \
            -input=false \
            -lock-timeout=5m \
            $TARGET_ARGS \
            $DESTROY_ARG \
            $REPLACE_ARGS \
            -var="tenancy_ocid=$OCI_TENANCY_OCID" \
            -var="compartment_ocid=$OCI_COMPARTMENT_OCID" \
            -var="talos_image_ocid=${{ steps.talos_image.outputs.ocid }}" \
            -var="omni_machine_config=$OMNI_MACHINE_CONFIG" \
            -var="omni_join_token=$OMNI_JOIN_TOKEN" \
            -var="omni_endpoint=$OMNI_ENDPOINT" \
            -var="tailscale_auth_key=$NODES_TAILSCALE_AUTHKEY" \
            -var="oci_config_profile=DEFAULT" \
            -var="enable_oci_vpn=true" \
            -var="enable_oci_vpn_probe=$VPN_PROBE" \
            -var="cpe_remediator_mode=$CPE_REMEDIATOR_MODE" \
            -var="openwrt_resolver_ip=$OPENWRT_RESOLVER_IP" \
            -var="home_cpe_public_ip=$HOME_CPE_PUBLIC_IP" \
            -var="cpe_local_identifier=$CPE_LOCAL_IDENTIFIER" \
            -var="omni_target_ip=$OMNI_TARGET_IP" \
            -var="ddns_hostname=$DDNS_HOSTNAME" \
            -var="cpe_recreate_fn_push_user_ocid=$CPE_RECREATE_FN_PUSH_USER_OCID" \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -var="temp_diag_password=$TEMP_DIAG_PASSWORD" \
            "${EXTRA_TFVARS_ARGS[@]}" \
            -var-file=terraform.tfvars \
            -out=tfplan
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OMNI_MACHINE_CONFIG: ${{ secrets.OMNI_MACHINE_CONFIG }}
          OMNI_JOIN_TOKEN: ${{ secrets.OMNI_JOIN_TOKEN }}
          OMNI_ENDPOINT: ${{ secrets.OMNI_ENDPOINT }}
          NODES_TAILSCALE_AUTHKEY: ${{ secrets.NODES_TAILSCALE_AUTHKEY }}
          OPENWRT_RESOLVER_IP: ${{ secrets.OPENWRT_RESOLVER_IP }}
          HOME_CPE_PUBLIC_IP: ${{ secrets.HOME_CPE_PUBLIC_IP }}
          CPE_LOCAL_IDENTIFIER: ${{ secrets.CPE_LOCAL_IDENTIFIER }}
          OMNI_TARGET_IP: ${{ secrets.OMNI_TARGET_IP }}
          DDNS_HOSTNAME: ${{ secrets.DDNS_HOSTNAME }}
          CPE_RECREATE_FN_PUSH_USER_OCID: ${{ secrets.CPE_RECREATE_FN_PUSH_USER_OCID }}
          TARGETS: ${{ github.event.inputs.targets }}
          VPN_PROBE: ${{ github.event.inputs.vpn_probe || 'false' }}
          CPE_REMEDIATOR_MODE: ${{ github.event.inputs.cpe_remediator_mode || 'function' }}
          DESTROY: ${{ github.event.inputs.destroy || 'false' }}
          REPLACE: ${{ github.event.inputs.replace || '' }}
          ALLOW_REPLACE: ${{ github.event.inputs.allow_replace || 'false' }}
          SSH_PUBLIC_KEY: ${{ github.event.inputs.ssh_public_key || secrets.SSH_PUBLIC_KEY }}
          TEMP_DIAG_PASSWORD: ${{ github.event.inputs.temp_diag_password || '' }}
          EXTRA_TFVARS: ${{ github.event.inputs.extra_tfvars || '' }}
          TF_LOG: WARN

      - name: Enforce Always Free plan
        working-directory: tofu/oci
        run: |
          tofu show -json tfplan > tfplan.json
          python3 ../../scripts/check_free_tier_plan.py tfplan.json \
            --current-usage ../../free-tier-current.json

      - name: Reject destructive plan
        working-directory: tofu/oci
        run: |
          tofu show -json tfplan \
            | jq -r '.resource_changes[]
              | select(.change.actions | index("delete"))
              | "\(.address)\t\(.change.actions | join(","))"' \
            > destructive-changes.txt

          if [ -s destructive-changes.txt ]; then
            if { [ "$DESTROY" = "true" ] || [ "$ALLOW_REPLACE" = "true" ]; } && [ -n "$TARGETS" ]; then
              FAIL=0
              while IFS="$(printf '\t')" read -r address actions; do
                MATCH=0
                for target in $TARGETS; do
                  if [ "$address" = "$target" ] || [[ "$address" == "$target["* ]]; then
                    MATCH=1
                  fi
                done
                if [ "$MATCH" -ne 1 ]; then
                  echo "ERROR: destructive change outside requested targets: $address $actions"
                  FAIL=1
                fi
              done < destructive-changes.txt
              if [ "$FAIL" -eq 0 ]; then
                echo "Allowing explicit targeted destructive changes:"
                cat destructive-changes.txt
                exit 0
              fi
            fi
            echo "ERROR: plan contains destructive changes; refusing to upload/apply tfplan."
            cat destructive-changes.txt
            exit 1
          fi
        env:
          TARGETS: ${{ github.event.inputs.targets }}
          DESTROY: ${{ github.event.inputs.destroy || 'false' }}
          ALLOW_REPLACE: ${{ github.event.inputs.allow_replace || 'false' }}

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tofu/oci/tfplan
          retention-days: 1

  apply:
    name: Tofu Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write OCI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_API_KEY_PEM" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
          OCI_REGION: ${{ secrets.OCI_REGION }}

      - name: Write backend config
        run: printf '%s' "$TF_BACKEND_CONFIG" > tofu/oci/backend-config.tfvars
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}

      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Verify local remediator retirement
        if: github.event.inputs.cpe_remediator_mode == 'local-remediator'
        env:
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          CPE_REMEDIATOR_MODE: ${{ github.event.inputs.cpe_remediator_mode || 'function' }}
        run: |
          if [ "$CPE_REMEDIATOR_MODE" != "local-remediator" ]; then
            exit 0
          fi
          FUNCTIONS=$(oci fn function list --compartment-id "$OCI_COMPARTMENT_OCID" \
            --all --output json)
          SCHEDULES=$(oci resource-scheduler schedule list \
            --compartment-id "$OCI_COMPARTMENT_OCID" --all --output json)
          FUNCTION_QUERY='[.data[] | select(."display-name" == "cpe-auto-recreate"'
          FUNCTION_QUERY+=' and ."lifecycle-state" != "DELETED")] | length == 0'
          SCHEDULE_QUERY='[.data[] | select(."display-name" == "cpe-auto-recreate-schedule"'
          SCHEDULE_QUERY+=' and ."lifecycle-state" != "DELETED")] | length == 0'
          if ! jq -e "$FUNCTION_QUERY" <<< "$FUNCTIONS" >/dev/null || \
            ! jq -e "$SCHEDULE_QUERY" <<< "$SCHEDULES" >/dev/null; then
            echo "ERROR: cpe-auto-recreate Function or scheduler still exists."
            echo "Complete the reviewed retire-function apply first."
            exit 1
          fi

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.0
        with:
          tofu_version: "1.11.5"

      - name: Setup Go for remediator artifact
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build remediator artifact
        run: bash scripts/build-cpe-remediator.sh

      - name: Tofu Init
        working-directory: tofu/oci
        run: tofu init -backend-config=backend-config.tfvars

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: tofu/oci

      - name: Tofu Apply
        working-directory: tofu/oci
        run: tofu apply -input=false -lock-timeout=5m -auto-approve tfplan
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          TF_LOG: WARN
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLODUFLARE_API_TOKEN_OCI }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_SYSCODEUK_ID }}

  health:
    name: Verify OCI release health
    # Health is private-network-only. OCI provisioning remains GitHub-hosted above.
    runs-on:
      group: omni-runner
      labels: self-hosted
    needs: apply
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.apply == 'true' &&
      github.event.inputs.coordinator_release == 'true' &&
      needs.apply.result == 'success'
    steps:
      # A self-hosted runner has no prior job workspace: regenerate all evidence here.
      - name: Checkout health verifier
        uses: actions/checkout@v4

      - name: Prepare private health evidence directory
        run: |
          rm -rf .release-health
          mkdir -m 700 .release-health

      - name: Verify coordinator release health from Omni
        # v1 does not exist; pin the inspected v1.95.0 commit.
        uses: jdmcmahan/omnictl-action@3904a0719b14aa388c445cae7084a19d928a317b
        with:
          omni-endpoint: ${{ secrets.OMNI_ENDPOINT }}
          omni-service-account-key: ${{ secrets.OMNI_SERVICE_ACCOUNT_KEY }}
          command: >-
            set -eu &&
            test -n "$OMNI_ENDPOINT" &&
            test -n "$OMNI_SERVICE_ACCOUNT_KEY" &&
            omnictl cluster status oci-lab --wait 90s > .release-health/omni-status.txt &&
            omnictl get clustermachine -l 'omni.sidero.dev/cluster=oci-lab' -o json \
              > .release-health/cluster-machines.json &&
            omnictl talosconfig -c oci-lab --force --merge=false .release-health/talosconfig &&
            omnictl kubeconfig -c oci-lab --service-account --user oci-release-health --ttl 15m \
              --force --merge=false .release-health/kubeconfig

      - name: Install verified Kubernetes client
        env:
          KUBERNETES_VERSION: ${{ github.event.inputs.kubernetes_version }}
        run: |
          set -euo pipefail
          test -n "$KUBERNETES_VERSION" || { echo 'ERROR: missing approved Kubernetes version' >&2; exit 1; }
          curl --fail --silent --show-error --location --retry 3 \
            "https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl" \
            --output .release-health/kubectl
          curl --fail --silent --show-error --location --retry 3 \
            "https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl.sha256" \
            --output .release-health/kubectl.sha256
          (cd .release-health && echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -)
          chmod 700 .release-health/kubectl

      - name: Verify exact Talos and Kubernetes release health
        env:
          TALOS_VERSION: ${{ github.event.inputs.talos_version }}
          KUBERNETES_VERSION: ${{ github.event.inputs.kubernetes_version }}
          OMNI_ENDPOINT: ${{ secrets.OMNI_ENDPOINT }}
          OMNI_SERVICE_ACCOUNT_KEY: ${{ secrets.OMNI_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$TALOS_VERSION" || { echo 'ERROR: missing approved Talos version' >&2; exit 1; }
          test -n "$KUBERNETES_VERSION" || { echo 'ERROR: missing approved Kubernetes version' >&2; exit 1; }
          test -n "$OMNI_ENDPOINT" || { echo 'ERROR: missing Omni service-account endpoint' >&2; exit 1; }
          test -n "$OMNI_SERVICE_ACCOUNT_KEY" || { echo 'ERROR: missing Omni service-account key' >&2; exit 1; }
          test -s .release-health/omni-status.txt || { echo 'ERROR: Omni status evidence is absent' >&2; exit 1; }
          test -s .release-health/cluster-machines.json || {
            echo 'ERROR: Omni machine evidence is absent' >&2
            exit 1
          }
          test -s .release-health/talosconfig || { echo 'ERROR: SA-generated talosconfig is absent' >&2; exit 1; }
          test -s .release-health/kubeconfig || { echo 'ERROR: SA-generated kubeconfig is absent' >&2; exit 1; }
          grep -Eq '^Cluster "oci-lab" RUNNING Ready ' .release-health/omni-status.txt || {
            echo 'ERROR: oci-lab did not reach RUNNING Ready within the bounded Omni wait.' >&2
            exit 1
          }
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from scripts.verify_oci_release_health import json_stream

          entries = json_stream(Path('.release-health/cluster-machines.json'))
          node_ids = []
          for entry in entries:
              metadata = entry.get('metadata', {}) if isinstance(entry, dict) else {}
              labels = metadata.get('labels', {})
              node_id = metadata.get('id')
              if labels.get('omni.sidero.dev/cluster') == 'oci-lab' and isinstance(node_id, str):
                  node_ids.append(node_id)
          if len(node_ids) != 2 or len(set(node_ids)) != 2:
              sys.exit('ERROR: Omni must select exactly two distinct oci-lab machine UUIDs')
          with open('.release-health/machine-ids.txt', 'w', encoding='utf-8') as output:
              output.write('\n'.join(sorted(node_ids)) + '\n')
          PY
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-amd64" \
            --output .release-health/talosctl-linux-amd64
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/sha256sum.txt" \
            --output .release-health/sha256sum.txt
          (cd .release-health && grep ' talosctl-linux-amd64$' sha256sum.txt | sha256sum -c -)
          chmod 700 .release-health/talosctl-linux-amd64
          mkdir -m 700 .release-health/empty-siderov1-keys
          SIDEROV1_KEY="$OMNI_SERVICE_ACCOUNT_KEY" \
          SIDEROV1_KEYS_DIR=.release-health/empty-siderov1-keys \
          timeout 90s .release-health/talosctl-linux-amd64 get version \
            --talosconfig .release-health/talosconfig \
            --nodes "$(paste -sd, .release-health/machine-ids.txt)" \
            --output json \
            > .release-health/talos-version.json
          KUBECONFIG=.release-health/kubeconfig timeout 30s .release-health/kubectl get --raw=/readyz >/dev/null
          KUBECONFIG=.release-health/kubeconfig timeout 30s .release-health/kubectl get nodes -o json \
            > .release-health/kubernetes-nodes.json
          KUBECONFIG=.release-health/kubeconfig timeout 30s .release-health/kubectl version -o json \
            > .release-health/kubernetes-version.json
          python3 scripts/verify_oci_release_health.py \
            --machine-ids .release-health/machine-ids.txt \
            --talos-version-output .release-health/talos-version.json \
            --kubernetes-nodes .release-health/kubernetes-nodes.json \
            --kubernetes-version .release-health/kubernetes-version.json \
            --talos-version "$TALOS_VERSION" \
            --expected-kubernetes-version "$KUBERNETES_VERSION"

      - name: Remove private health evidence
        if: always()
        run: rm -rf .release-health
